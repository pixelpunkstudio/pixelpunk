        caption: |-
          The dishes are done, the house is still full, and everyone is asking what's for lunch 🦃
          Our new article has eight cozy, screen-free activities for every age, plus a simple plan for the day that keeps things calm until the leftovers run out.
          Read it and print the free pages: link in bio 👉 pixelpunkstudio.shop
          #thanksgivingweekend #familyactivities #screenfree #blackfridayathome #printables
    body: |
      <p>The big meal is over, the dishes are finally done, and you wake up on Friday with a full house and nothing
      planned. The kids are restless by nine, the teenagers have vanished into their phones, and Grandpa is wondering
      what happens next. You could brave the stores, or you could do almost nothing at all, with just enough on the
      table to keep every age happy. The day after Thanksgiving is one of the few days when nobody has anywhere to be.
      A little planning is all it takes to make the most of it.</p>

      <h2>8 cozy, screen-free activities</h2>
      <ol>
        <li><strong>Build-your-own leftovers lunch.</strong> Put the turkey, rolls, stuffing and cranberry sauce on
        the counter and let everyone make their own sandwich. Nobody has to cook, and the kids can help set it up.</li>
        <li><strong>A word search race in pairs.</strong> Print one puzzle per team, pairing an older solver with a
        younger one. The first pair to find ten words wins the last slice of pie.</li>
        <li><strong>A slow family walk.</strong> Everyone needs to get out after yesterday. Give the kids a list of
        things to find: a red leaf, an acorn, a feather, something round.</li>
        <li><strong>Leaf rubbings.</strong> Back at the table, put the leaves from your walk under thin paper and rub
        them gently with the side of a crayon. Even toddlers can do it, and it costs nothing.</li>
        <li><strong>The old photo box.</strong> Bring out the albums and ask the oldest person in the room to tell
        the story behind one picture. Let the youngest choose it.</li>
        <li><strong>An all-day coloring table.</strong> Leave out pages for every age with a pot of crayons and
        pencils. People wander over, color for a while and drift off, which suits a slow day.</li>
        <li><strong>A cocoa bar.</strong> Make a big pot of hot chocolate and set out marshmallows, cinnamon and
        crushed candy canes. It marks the afternoon as an occasion, with almost no work.</li>
        <li><strong>A paper chain countdown to Christmas.</strong> Cut strips of paper, write a small activity on
        each one, and link 24 of them together. Then hang the chain and take off one link each day from December 1.</li>
      </ol>

      <h2>A simple plan for the day</h2>
      <ul>
        <li><strong>Morning puzzles.</strong> Leave out the coloring pages and puzzles the night before, so early risers
        have something quiet to do.</li>
        <li><strong>A walk before lunch.</strong> Go out in the late morning, before anyone settles in for the day.</li>
        <li><strong>A leftovers buffet.</strong> Put it all on the counter and let everyone help themselves.</li>
        <li><strong>One group activity.</strong> In the afternoon, bring out the word search race or the photo box, then
        let people rest.</li>
        <li><strong>Cocoa and the paper chain.</strong> Finish the evening with both, and call it a day.</li>
      </ul>

      <h2>Keeping every age happy</h2>
      <ul>
        <li><strong>Little ones:</strong> a simple coloring page, a job at the lunch counter and a list for the
        walk.</li>
        <li><strong>Ages 6 to 10:</strong> the leaf rubbings and a word search with a fun fact to read aloud to the
        room.</li>
        <li><strong>Teens:</strong> give them a role rather than a worksheet. They can run the race, keep score or
        photograph the old photos for the family.</li>
        <li><strong>Grandparents:</strong> a comfortable chair by the table, a large print puzzle and an invitation
        to tell the story. Being asked is the best part.</li>
      </ul>
      <p>Don't try to do all eight. Two or three is plenty, and a nap is a perfectly good activity.</p>

      <h2>Free pages to print tonight</h2>
      <p>Print them on Thanksgiving night, while the printer still works and everyone is busy with pie. Our free
      Thanksgiving word search suits older kids and grown-ups, the Candlelit Evenings puzzle from our hygge book is a
      calm large print page for adults, and the puppy and kitten coloring page is ready for little hands. For the rest
      of the winter, Cozy Winter Hygge Word Search has 55 large print puzzles and Cute Farm Days has 50 farm animals to
      color, each with a fun fact to read together.</p>

