      pins:   # two pins only: a third, 14 days later, would fall after the Thanksgiving season (Nov 24)
        - {photo: hero, design: top, kicker: Thanksgiving weekend, headline: "The Day After Thanksgiving: 8 Cozy Screen-Free Activities"}
        - {photo: walk, design: list, kicker: Full house, headline: "How to Plan a Calm Day After Thanksgiving", from: "A simple plan for the day"}
