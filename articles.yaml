          Bought a "large print" puzzle book that still felt too small? 👓
          Large print and jumbo print are not the same thing. Our new article explains the difference, who each one suits and what to check before you buy, with free pages to compare both at home.
          Read it and print the free pages: link in bio 👉 pixelpunkstudio.shop
          #largeprint #jumboprint #wordsearch #puzzlesforseniors #lowvision
    body: |
      <p>"Large print" on a cover sounds like a promise, but it isn't one. There is no single rule for what the
      words mean on a puzzle book, so one "large print" word search has letters you can read from across the
      table, and the next one is barely bigger than a newspaper. If you are buying for yourself, a parent with
      tired eyes or someone with low vision, here is what the labels usually mean and how to make sure the book
      really works before it becomes a gift that stays in a drawer.</p>

      <h2>What "large print" really means</h2>
      <p>Ordinary books and puzzle magazines print letters of about 9 to 12 points. Most "large print" puzzle
      books use letters of about 14 to 18 points, often with bigger grids of 20 x 20 squares and 25 to 30 words
      per puzzle. "Jumbo", "extra large" or "giant" print goes further: letters of 24 points or more, fewer
      squares and shorter word lists, so each letter has room to breathe. Our own books are a good example: the
      grids in Cozy Christmas Word Search have letters of about 15 points, while Jumbo Christmas Word Search
      prints both the grid and the word list at 30 points, twice as big.</p>

      <h2>Large print vs jumbo print at a glance</h2>
      <ul>
        <li><strong>Large print:</strong> letters about 14 to 18 points, grids around 20 x 20, 25 to 30 words. More
        puzzle per page, still a real challenge.</li>
        <li><strong>Jumbo print:</strong> letters 24 points or more, grids around 14 x 12, 15 to 20 words. Fewer
        words, but every letter reads at a glance.</li>
        <li><strong>Both</strong> should have dark letters on a light page, wide margins and the answers at the back.</li>
      </ul>

      <h2>Which one to choose</h2>
      <ul>
        <li><strong>Reads a newspaper with glasses, just gets tired:</strong> large print is usually enough.</li>
        <li><strong>Needs a magnifier for small print, or has macular changes or cataracts:</strong> choose jumbo print.</li>
        <li><strong>Solves in a dim room or in bed:</strong> go one size up from what you'd pick at a sunny table.</li>
        <li><strong>Has shaky hands:</strong> jumbo print, since bigger squares are easier to circle.</li>
        <li><strong>Not sure?</strong> Print one free page of each size (below) and let them choose.</li>
      </ul>

      <h2>How to check a book before you buy</h2>
      <ol>
        <li><strong>Look for a number, not just a label.</strong> A book that states its font size ("30 pt") is
        usually honest about it; "large print" alone tells you little.</li>
        <li><strong>Use the "Look inside" pages.</strong> Compare a grid with the size of the cover: if the grid
        fills most of an 8.5 x 11 inch page with only 14 or 15 squares across, the letters are big.</li>
        <li><strong>Count the squares across.</strong> At the same page size, 14 squares means much bigger letters
        than 20 or 25.</li>
        <li><strong>Check the page size.</strong> A 6 x 9 inch book with "large print" has smaller letters than an
        8.5 x 11 inch one with the same grid.</li>
        <li><strong>Read the reviews for "too small".</strong> Buyers who bought for a parent usually say so quickly.</li>
      </ol>

      <h2>Other things that matter as much as letter size</h2>
      <ul>
        <li><strong>Contrast:</strong> black letters on white or very light paper. Busy pictures behind the grid
        make letters harder to find.</li>
        <li><strong>A plain font:</strong> simple, even letters without decoration read best.</li>
        <li><strong>Single-sided pages:</strong> no ink showing through from the back, and a page you can tear out
        and hold close.</li>
        <li><strong>Good light:</strong> a lamp from the side or behind the shoulder helps more than people expect.</li>
        <li><strong>A pencil or felt-tip with a thick line,</strong> so circled words stay easy to see.</li>
      </ul>

      <h2>Try both sizes for free</h2>
      <p>The easiest test is on paper. Print our free large print Christmas word search and our free jumbo print
      page, put them side by side and see which one feels relaxing rather than tiring. When you know, Cozy
      Christmas Word Search has 55 large print puzzles, and Jumbo Christmas Word Search has 100 puzzles in 30
      point print with a fun fact facing every one.</p>

