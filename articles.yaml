    body: |
      <p><em>Hygge</em> (say "hoo-gah") is the Danish word for that warm, contented feeling of being cozy and
      at ease, often with people you love. It isn't about buying anything. It's about slowing down and
      noticing small comforts, which is exactly what winter is good for. Here are fifteen easy ways to bring
      a little hygge home this season.</p>

      <h2>Make your home feel warm</h2>
      <ol>
        <li><strong>Light candles in the late afternoon.</strong> Soft light is the heart of hygge. Group a few
        candles or lanterns together (and never leave them burning unattended).</li>
        <li><strong>Build a reading nook.</strong> A chair by the window, a blanket, a lamp and a small table
        for your mug. That's all it takes.</li>
        <li><strong>Bring in a little nature.</strong> Pine branches, pinecones, a bowl of clementines or a pot
        of rosemary on the windowsill.</li>
        <li><strong>Pile on the textures.</strong> Wool socks, a knitted throw, sheepskin on a chair: winter is
        the season for soft things.</li>
      </ol>

      <h2>Slow, simple rituals</h2>
      <ol start="5">
        <li><strong>A proper hot drink.</strong> Hot cocoa with marshmallows, spiced cider or tea in your
        favorite mug, made slowly and enjoyed sitting down.</li>
        <li><strong>Slow Sunday mornings.</strong> Pancakes, the radio on, no plans before noon.</li>
        <li><strong>Bake something that smells good.</strong> Cinnamon rolls, gingerbread or a simple loaf of
        bread fill the whole house.</li>
        <li><strong>A soup night.</strong> One big pot, crusty bread and nobody in a hurry.</li>
        <li><strong>Puzzles by candlelight.</strong> A word search, a jigsaw or a crossword is the perfect
        screen-free way to unwind. Try our free hygge word search below.</li>
      </ol>

      <h2>Hygge with the people you love</h2>
      <ol start="10">
        <li><strong>Board game evening.</strong> Old favorites, snacks in bowls, phones in another room.</li>
        <li><strong>Write letters or cards.</strong> A handwritten note is a small, warm gift.</li>
        <li><strong>Share a story night.</strong> Read aloud, look through old photo albums or tell family
        stories.</li>
        <li><strong>Invite a friend for fika.</strong> Borrowed from Sweden, it means coffee and something sweet, no special occasion needed.</li>
      </ol>

      <h2>Enjoy winter outside, then come back in</h2>
      <ol start="14">
