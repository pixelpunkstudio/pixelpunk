        caption: |-
          Every Thanksgiving someone ends up alone in an armchair while the noise goes on around them. 🦃
          Our new article has 8 easy games that keep grandparents part of the day, simple jobs they'll enjoy, and a free large print Thanksgiving word search.
          Read it and print the free page: link in bio 👉 pixelpunkstudio.shop
          #thanksgivingactivities #activitiesforseniors #thanksgivinggames #largeprint #printables
    body: |
      <p>Thanksgiving is loud. The kitchen is busy, the kids are running, the game is on, and conversations
      happen in three rooms at once. For an older guest with tired ears or tired legs, it is easy to end up in
      the quiet armchair by the window, smiling, but outside the day. Nobody means for it to happen. A couple of
      easy games and a real job or two are often all it takes to keep grandparents in the middle of things.</p>

      <h2>Give them a seat in the middle</h2>
      <p>Before any game, think about the chair. Put a comfortable chair with arms where the action is, near the
      kitchen door or at the end of the table, not in the far corner. Add a small side table for a drink and
      a puzzle, and good light. Being part of the day starts with being where people walk past.</p>

      <h2>8 easy Thanksgiving games for grandparents</h2>
      <ol>
        <li><strong>A large print Thanksgiving word search.</strong> Print a few copies and let grandparents and
        grandkids race, or solve one together while the turkey rests.</li>
        <li><strong>Thanksgiving memories jar.</strong> Everyone writes a favorite Thanksgiving memory on a slip of
        paper; grandparents draw them and read them out, and guess who wrote each one.</li>
        <li><strong>"When I was your age."</strong> The grandkids ask questions from a list: first job, first car,
        what Thanksgiving dinner looked like in 1965. The older the stories, the better.</li>
        <li><strong>Gratitude alphabet.</strong> Go around the table and name something you are thankful for, from
        A to Z. Easy to join from a chair.</li>
        <li><strong>Guess the pie.</strong> Small tastes of each pie or side dish with eyes closed. Grandparents
        make excellent judges.</li>
        <li><strong>Card games.</strong> Rummy, crazy eights or go fish work across three generations. Large-number
        playing cards help.</li>
        <li><strong>Old photo guessing game.</strong> Bring out a few old family photos and let the grandparents
        tell the story behind each one.</li>
        <li><strong>Family trivia.</strong> Questions only the oldest guests know: where Grandpa proposed, the name
        of the first family dog.</li>
      </ol>

      <h2>Jobs that keep grandparents part of the day</h2>
      <ul>
        <li><strong>Chief taster</strong> for the gravy and the stuffing, seated at the kitchen counter.</li>
        <li><strong>Table folding:</strong> napkins, place cards or a name on each card, done sitting down.</li>
        <li><strong>Recipe keeper:</strong> the family recipe read out loud, step by step, for whoever is cooking.</li>
        <li><strong>Grace or the toast,</strong> if they enjoy it.</li>
        <li><strong>Kids' table helper:</strong> a grandparent with a stack of coloring pages and word searches
        keeps the little ones calm.</li>
      </ul>

      <h2>Small changes that help</h2>
      <ul>
        <li><strong>Turn the TV down</strong> during dinner: background noise makes conversation hard to follow.</li>
        <li><strong>Large print everything:</strong> place cards, puzzles, even the menu if you make one.</li>
        <li><strong>Plan the games before the meal,</strong> when energy is highest, not at 9 pm.</li>
        <li><strong>Offer a quiet room</strong> with a blanket for a short rest, so leaving the table is not leaving the day.</li>
        <li><strong>Sit someone next to them</strong> who will repeat the joke everyone laughed at.</li>
      </ul>

      <h2>Print the Thanksgiving word search</h2>
      <p>Our free Thanksgiving word search is in large print with its answer key, ready to print on letter paper
      before the guests arrive. For guests who need even bigger letters, our free jumbo print page has 30 point
      print, and the retirement word search makes a fun second puzzle for grandparents who just stopped working.</p>

