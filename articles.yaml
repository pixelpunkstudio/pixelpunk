      instagram:
        headline: Visiting a parent in assisted living?
        list_title: Things to do together
        from: "10 easy things to do together in an hour"
        caption: |-
          Do your visits drift into silence, or end in front of the TV? 🫖
          Our new article has 10 easy things to do with a parent in assisted living in about an hour, what to pack in a small visit bag, and free large print printables to bring along.
          Read it and print the free pages: link in bio 👉 pixelpunkstudio.shop
          #assistedliving #activitiesforseniors #agingparents #caregiving #largeprint
    body: |
      <p>You drive over, you hug, you ask how the food is, and twenty minutes later you are both watching the
      television in a small room. Visits to a parent in assisted living often go like this, not because there is
      nothing to say, but because there is nothing to do. A shared activity takes the pressure off the
      conversation: your hands are busy, the talk comes on its own, and the hour feels like time together instead
      of a check-in.</p>

      <h2>Before you go: pack a small visit bag</h2>
      <ul>
        <li><strong>Two or three large print puzzles</strong> printed at home, and two pencils.</li>
        <li><strong>A deck of playing cards,</strong> ideally with large numbers.</li>
        <li><strong>A few photos</strong> or one small album.</li>
        <li><strong>A treat to share:</strong> their favorite cookies, a seasonal fruit, a good tea.</li>
        <li><strong>Something to leave behind:</strong> a puzzle for tomorrow, a card from the grandchildren.</li>
      </ul>

      <h2>10 easy things to do together in an hour</h2>
      <ol>
        <li><strong>Solve a word search together.</strong> One puzzle, one of you reads the words, the other
        hunts. It works even on a tired day.</li>
        <li><strong>Play a simple card game:</strong> rummy, crazy eights, war or a game of solitaire you play together.</li>
        <li><strong>Look through old photos</strong> and ask the questions you never asked: who is that, where
        was this, what happened next?</li>
        <li><strong>Record a story.</strong> Ask about their first job or how they met, and record it on your phone
        for the family.</li>
        <li><strong>Read aloud:</strong> the local paper, a short story, or letters from the grandchildren.</li>
        <li><strong>Listen to their music.</strong> A playlist from the year they were twenty brings back stories.</li>
        <li><strong>Do their nails or a hand massage</strong> with a nice lotion: calm, close and no talking needed.</li>
        <li><strong>Take a slow walk</strong> to the garden, the lobby or the end of the corridor.</li>
        <li><strong>Write cards together</strong> for birthdays or the holidays; you write, they dictate.</li>
        <li><strong>Plan the next visit:</strong> pick the next puzzle, the next photos or the next treat, so there
        is something to look forward to.</li>
      </ol>

      <h2>When the visit gets hard</h2>
      <ul>
        <li><strong>Tired or not in the mood:</strong> switch to something passive, like music or reading aloud,
        and keep the visit shorter.</li>
        <li><strong>Hard of hearing:</strong> sit close, face to face, with the TV off, and use activities that
        need few words.</li>
        <li><strong>Memory changes:</strong> choose easy puzzles and familiar old photos, and don't correct the
        details of a story.</li>
        <li><strong>Small room, shared space:</strong> a lap tray or the corner of a table is all a puzzle or a
        card game needs.</li>
      </ul>

      <h2>Leave something behind</h2>
      <p>A puzzle left on the table, a card from the grandchildren pinned by the bed or a new photo in a frame
      keeps the visit going after you leave, and gives the staff and other residents something to ask about.</p>

      <h2>Free printables for your next visit</h2>
      <p>Print a few of our free puzzles before you go: a retirement word search, a jumbo print page with 30
      point letters and a cozy hygge puzzle, each with its answer key. For weekly visits, Retirement Word Search,
      Jumbo Christmas Word Search and Cozy Winter Hygge Word Search have dozens more, printed on one side so each
      page can be torn out and left behind.</p>

