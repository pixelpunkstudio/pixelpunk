# Pixel Punk Studio catalog, rendered into index.html by `python -m kdp site`.
# amazon: the paperback ASIN (https://www.amazon.com/dp/<ASIN>). Leave it empty for "coming soon".
# published: Amazon publication date; the card shows a "New" pill for 90 days after it.
site_url: https://pixelpunkstudio.shop/
newsletter:                    # Brevo form "Website newsletter" -> list Pixel Punk Newsletter
  form_action: https://764954f3.sibforms.com/serve/MUIFAFwA6WeLL065f-kQ4KU-sHJ5m9BVHecuyl4dvG4kdCjxFyg7yB75Uco-e17estaR6g5n75CmCcLEUN1luEQHz8J7Qd6O2gsY3Qy7zDDD7zsnkBQH6ISDWXFTpXPSin0AOgOtwOeqvOcx-NG1qiKPagbowdb-NNy-mfMFZA5v58ahGvwHBIqNug7_-KqfbOmA0pGGGEIxpG3ZOg==
  after_submit: subscribed.html # double opt-in: "check your inbox" page; Brevo sends people to welcome.html after confirming
author_page: https://www.amazon.com/Pixel-Punk-Studio/e/B0FCYYJ5FY
# home_printables: the free printables shown on the home page (page names, up to 6), changed with the seasons
home_printables: [free-printable-thanksgiving-word-search, free-printable-christmas-word-search,
                  free-printable-nativity-word-search, free-printable-hygge-word-search,
                  free-printable-bug-word-search-for-kids, free-printable-puppy-kitten-coloring-page]

