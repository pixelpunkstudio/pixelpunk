# Standalone free printables (not samples of a book). Each gets a page, a pin image and a PDF built
# from books/<source>/words.yaml (puzzle = 1-based index). related: book slugs promoted on the page.
printables:
  - key: halloween-word-search
    page: free-printable-halloween-word-search
    title: Halloween Night Word Search
    seo_title: "Free Printable Halloween Word Search for Adults (Large Print)"
    pin_title: "Halloween Word Search"
    source: holiday-printables
    puzzle: 1
    related: [fall-crisp-leaves]
    about: >-
      Halloween Night: 30 spooky-but-friendly words, from jack o lanterns and candy corn to black cats,
      cauldrons and a full moon. A large print puzzle for teens, adults and seniors.
    more: Love fall puzzles? Crisp Leaves Fall Word Search has 55 more, from apple picking to cozy campfires.
