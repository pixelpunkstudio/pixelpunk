<script>
// Mobile menu: the hamburger opens the panel (site links + this page's navigation); Esc or a link closes it.
(() => {
  const b = document.querySelector(".burger"), p = document.getElementById("mobile-panel");
  if (!b || !p) return;
  const set = open => { b.setAttribute("aria-expanded", open); p.hidden = !open;
                        document.body.classList.toggle("menu-open", open); };
  b.addEventListener("click", () => set(p.hidden));
  p.addEventListener("click", ev => { if (ev.target.closest("a")) set(false); });
  addEventListener("keydown", ev => { if (ev.key === "Escape") set(false); });
})();
</script>

<script>
// Search in the browser: search.json holds every book, free printable and article. All the words typed must
// appear (a word also matches its plural and longer forms: "bug" finds "bugs"); title matches rank first.
(async () => {
  const q = (new URLSearchParams(location.search).get("q") || "").trim();
  const out = document.getElementById("results"), info = document.getElementById("search-info");
  document.querySelectorAll('.search-form input[name="q"]').forEach(i => { i.value = q; });
  if (!q) { info.textContent = "Type a word above: a theme (Christmas, farm, bugs), an audience (seniors, kids) or a topic (large print, coloring)."; return; }
  let items = [];
  try { items = await (await fetch("search.json", {cache: "no-cache"})).json(); }
  catch (e) { info.textContent = "Search is not available right now. Please try again later."; return; }
  const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ");
  const stem = w => w.length > 3 ? w.replace(/ies$/, "").replace(/([^s])s$/, "$1") : w;  // bugs -> bug, puppies -> pupp
  const terms = norm(q).split(" ").filter(w => w && !["the", "a", "an", "for", "and", "of", "to", "in"].includes(w)).map(stem);
  const scored = items.map(it => {
    const t = " " + norm(it.title) + " ", d = " " + norm(it.desc) + " ", x = " " + norm(it.text) + " ";
    let score = 0;
    for (const w of terms) {
      const re = new RegExp("\\b" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      const s = (re.test(t) ? 10 : 0) + (re.test(d) ? 4 : 0) + (re.test(x) ? 1 : 0);
      if (!s) return null;
      score += s;
    }
    return {it, score};
  }).filter(Boolean).sort((a, b) => b.score - a.score);
  info.textContent = scored.length ? `${scored.length} result${scored.length > 1 ? "s" : ""} for “${q}”`
                                   : `Nothing found for “${q}”. Try a shorter or more general word, or browse below.`;
  const esc = s => (s || "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  out.innerHTML = scored.map(({it}) => {
    const ext = it.url.startsWith("http");
    return `<a class="result" href="${esc(it.url)}"${ext ? ' target="_blank" rel="noopener"' : ""}>
      ${it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy">` : ""}
      <span><em class="kind">${esc(it.kind)}${ext ? " · on Amazon" : ""}</em><strong>${esc(it.title)}</strong>
      <span class="snippet">${esc(it.desc)}</span></span></a>`;
  }).join("");
})();
</script>
